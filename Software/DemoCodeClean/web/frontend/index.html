<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Handwriting Robot — Read</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="topbar"></div>

<main>
  <div class="page-header">
    <div><h1>Read a handwritten page</h1></div>
    <button class="reset-btn" id="resetPageBtn" title="Clear this page back to blank">⟳ Reset</button>
  </div>

  <div class="grid">
    <div class="panel">
      <h2>Page</h2>

      <div class="btn-row">
        <button id="previewToggleBtn">🎥 Live preview</button>
        <button id="captureBtn" disabled>📷 Capture</button>
        <button id="uploadTriggerBtn" class="secondary">Upload</button>
      </div>
      <img id="livePreviewImg" class="preview" style="display:none" />
      <input type="file" id="fileInput" accept="image/*" style="display:none" />
      <img id="previewImg" class="preview" style="display:none" />
      <div class="error-banner" id="imageError"></div>

      <label style="margin-top:18px">Expected text &mdash; one written line per text line</label>
      <textarea id="expectedText"></textarea>

      <label>Expected author</label>
      <select data-author-select id="expectedAuthor"></select>

      <div class="btn-row">
        <button id="classifyBtn" disabled>Classify</button>
      </div>
      <div class="error-banner" id="classifyError"></div>
    </div>

    <div class="panel">
      <h2>Result</h2>
      <div class="result-box" id="resultBox">

        <div class="stat-row">
          <span class="k">Text accuracy, page</span>
          <span class="v" id="rTextAcc">—</span>
        </div>
        <div class="pct-bar"><div id="rTextAccBar" style="width:0%"></div></div>

        <div class="stat-row" style="margin-top:14px">
          <span class="k">Author</span>
          <span class="v" id="rAuthor">—</span>
        </div>
        <div class="stat-row">
          <span class="k">Author confidence</span>
          <span class="v" id="rAuthorConf">—</span>
        </div>
        <div class="pct-bar"><div id="rAuthorConfBar" style="width:0%"></div></div>
        <div class="stat-row">
          <span class="k" id="rAuthorLinesKey">Lines with the right author</span>
          <span class="v" id="rAuthorLines">—</span>
        </div>
        <div class="pct-bar"><div id="rAuthorLinesBar" style="width:0%"></div></div>

        <label style="margin-top:18px">Per line</label>
        <table class="timing-table" id="rLineTable"></table>

        <label style="margin-top:18px">Read back as</label>
        <div class="readback" id="rText"></div>

        <div class="timing-box" id="classifyTiming"></div>
      </div>
      <p class="hint" id="idlePlaceholder"></p>
    </div>
  </div>
</main>

<script src="app.js"></script>
<script>
renderTopbar("read");
populateAuthorDropdowns();

const PAGE_KEY = "read";   //the key this page saves its state under
let capturedImageId = null;
let capturedBlob = null;
let previewOn = false;

const previewImg = document.getElementById("previewImg");
const livePreviewImg = document.getElementById("livePreviewImg");
const classifyBtn = document.getElementById("classifyBtn");
const captureBtn = document.getElementById("captureBtn");
const previewToggleBtn = document.getElementById("previewToggleBtn");
const idlePlaceholder = document.getElementById("idlePlaceholder");

function enableClassify() {
  classifyBtn.disabled = !(capturedImageId || capturedBlob);   //the buttons wake once there is a page to work on
}

function persist(extra = {}) {
  savePageState(PAGE_KEY, {
    expectedText: document.getElementById("expectedText").value,
    expectedAuthor: document.getElementById("expectedAuthor").value,
    capturedImageId,
    capturedDataUrl: extra.capturedDataUrl !== undefined ? extra.capturedDataUrl : (persist._lastDataUrl || null),   // an explicit value wins over the last one remembered
    lastResult: extra.lastResult !== undefined ? extra.lastResult : (persist._lastResult || null),
  });
  if (extra.capturedDataUrl !== undefined) persist._lastDataUrl = extra.capturedDataUrl;
  if (extra.lastResult !== undefined) persist._lastResult = extra.lastResult;
}

function pct(v) { return (v === null || v === undefined) ? "—" : v + "%"; }   //a missing figure shows as a dash

function showResult(res) {
  idlePlaceholder.style.display = "none";
  document.getElementById("resultBox").classList.add("show");
  document.getElementById("rText").textContent = res.predicted_text || "(nothing read)";
  renderTiming("classifyTiming", res.timing);

  const ta = res.text_accuracy_pct;
  document.getElementById("rTextAcc").textContent =
    ta === null || ta === undefined ? "(no expected text)" : ta + "%";
  document.getElementById("rTextAccBar").style.width = (ta || 0) + "%";   //the bar width is the accuracy itself

  const authorLabel = document.getElementById("rAuthor");
  authorLabel.textContent = res.predicted_author +
    (res.author_correct === true ? "  ✓" : res.author_correct === false ? "  ✗" : "");   //a tick or a cross only when an expected writer was given
  authorLabel.className = "v" + (res.author_correct === true ? " good"
                               : res.author_correct === false ? " bad" : "");

  document.getElementById("rAuthorConf").textContent = pct(res.author_confidence_pct);
  document.getElementById("rAuthorConfBar").style.width = (res.author_confidence_pct || 0) + "%";

  // Per page, the author figure asked for is "how many lines did it get
  // right".  That question only has an answer when an expected author was
  // given; without one the same count can still be reported, but against the
  // page's own answer rather than against the truth, and it is labelled as
  // that instead of being passed off as an accuracy.
  const n = res.lines_detected;
  const haveTruth = res.author_line_correct_pct !== null && res.author_line_correct_pct !== undefined;   //whether the server could score the lines against a truth
  const p = haveTruth ? res.author_line_correct_pct : res.author_line_agreement_pct;
  const count = Math.round((p || 0) * n / 100);    //the percentage turned back into a line count
  document.getElementById("rAuthorLinesKey").textContent =
    haveTruth ? "Lines with the right author" : "Lines agreeing with the page";
  document.getElementById("rAuthorLines").textContent =
    n ? `${count}/${n}  (${p}%)` : "—";
  document.getElementById("rAuthorLinesBar").style.width = (p || 0) + "%";

  renderLineTable(res.lines, res.predicted_author);
}

// Per line: the text accuracy, the author it named on its own and whether
// that was right, and how sure it was.  The character column is empty unless
// the expected text was given one line per written line, because splitting a
// pasted paragraph across the written lines would be a guess.
function renderLineTable(lines, pageAuthor) {
  const t = document.getElementById("rLineTable");
  if (!lines || !lines.length) { t.innerHTML = ""; return; }
  const hasChar = lines.some(r => r.char_accuracy_pct !== null && r.char_accuracy_pct !== undefined);   //the text column appears only with per line truth
  const hasTruth = lines.some(r => r.author_correct !== null && r.author_correct !== undefined);
  let h = "<tr><th>#</th>"
        + (hasChar ? "<th class='num'>Text</th>" : "")
        + "<th>Author</th><th class='num'>Conf.</th></tr>";
  for (const r of lines) {
    const wrong = hasTruth ? r.author_correct === false : r.author_matches_page === false;   // against the truth where there is one and against the page otherwise
    h += "<tr><td class='num'>" + r.line + "</td>"
       + (hasChar ? "<td class='num'>" + pct(r.char_accuracy_pct) + "</td>" : "")
       + "<td" + (wrong ? " class='bad'" : "") + ">" + r.author_named
       + (hasTruth ? (r.author_correct ? " ✓" : " ✗") : "") + "</td>"
       + "<td class='num'>" + pct(r.author_confidence_pct) + "</td></tr>";
  }
  t.innerHTML = h;
}

function resetPage() {
  capturedImageId = null;
  capturedBlob = null;
  persist._lastDataUrl = null;
  persist._lastResult = null;
  document.getElementById("expectedText").value = "";
  document.getElementById("fileInput").value = "";
  previewImg.style.display = "none";
  previewImg.src = "";
  document.getElementById("resultBox").classList.remove("show");
  idlePlaceholder.style.display = "block";
  clearError("imageError");
  clearError("classifyError");
  enableClassify();
  stopPreview();
}

wireResetButton("resetPageBtn", PAGE_KEY, resetPage);   // the reset button clears the saved state and blanks the form

(function restore() {
  const s = loadPageState(PAGE_KEY);
  if (!s) return;
  if (s.expectedText) document.getElementById("expectedText").value = s.expectedText;
  persist._lastDataUrl = s.capturedDataUrl || null;
  persist._lastResult = s.lastResult || null;
  if (s.capturedImageId) {
    capturedImageId = s.capturedImageId;
    previewImg.src = absoluteUrl(`/api/images/${s.capturedImageId}`);
    previewImg.style.display = "block";
  } else if (s.capturedDataUrl) {
    previewImg.src = s.capturedDataUrl;
    previewImg.style.display = "block";
    fetch(s.capturedDataUrl).then(r => r.blob()).then(b => { capturedBlob = b; enableClassify(); });   //the saved data url turned back into a blob to send
  }
  if (s.expectedAuthor) {
    const trySet = () => {
      const sel = document.getElementById("expectedAuthor");
      if ([...sel.options].some(o => o.value === s.expectedAuthor)) sel.value = s.expectedAuthor;   // the dropdown may still be loading so this retries
      else setTimeout(trySet, 200);
    };
    trySet();
  }
  if (s.lastResult) showResult(s.lastResult);
  enableClassify();
})();

document.getElementById("expectedText").addEventListener("input", () => persist());
document.getElementById("expectedAuthor").addEventListener("change", () => persist());

async function stopPreview() {
  if (!previewOn) return;
  previewOn = false;
  livePreviewImg.style.display = "none";
  livePreviewImg.src = "";
  previewToggleBtn.textContent = "🎥 Live preview";
  try { await apiFetch("/api/camera/preview/stop", { method: "POST" }); } catch (_) {}   //the camera is released as the preview closes
}

previewToggleBtn.addEventListener("click", async () => {
  clearError("imageError");
  if (previewOn) { await stopPreview(); return; }
  previewToggleBtn.disabled = true;
  try {
    await apiFetch("/api/camera/preview/start", { method: "POST" });
    previewOn = true;
    livePreviewImg.src = absoluteUrl("/api/camera/preview/stream") + "?t=" + Date.now();    // the timestamp keeps the browser off a cached stream
    livePreviewImg.style.display = "block";
    previewToggleBtn.textContent = "⏹ Stop preview";
    captureBtn.disabled = false;
  } catch (e) {
    showError("imageError", e.message);
  } finally {
    previewToggleBtn.disabled = false;
  }
});

captureBtn.addEventListener("click", async () => {
  clearError("imageError");
  captureBtn.disabled = true;
  captureBtn.innerHTML = '<span class="spinner"></span> Capturing...';
  try {
    const res = await apiFetch("/api/camera/capture", { method: "POST" });
    capturedImageId = res.image_id;
    capturedBlob = null;
    previewImg.src = absoluteUrl(res.image_url) + "?t=" + Date.now();
    previewImg.style.display = "block";
    enableClassify();
    persist({ capturedDataUrl: null });
  } catch (e) {
    showError("imageError", e.message);
  } finally {
    captureBtn.disabled = false;
    captureBtn.innerHTML = "📷 Capture";
  }
});

document.getElementById("uploadTriggerBtn").addEventListener("click", () => {
  document.getElementById("fileInput").click();
});

// The file is sent exactly as chosen and the SERVER decides which way up it
// is: StandUp settles the axis from the page itself, so an upload and a
// camera capture of the same sheet behave identically.
document.getElementById("fileInput").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  capturedBlob = file;
  capturedImageId = null;
  previewImg.src = URL.createObjectURL(file);   //the chosen file shown straight from the browser
  previewImg.style.display = "block";
  enableClassify();
  const reader = new FileReader();
  reader.onload = () => persist({ capturedDataUrl: reader.result });
  reader.readAsDataURL(file);
});

classifyBtn.addEventListener("click", async () => {
  clearError("classifyError");
  classifyBtn.disabled = true;
  classifyBtn.innerHTML = '<span class="spinner"></span> Classifying...';
  try {
    const form = new FormData();
    if (capturedBlob) form.append("image", capturedBlob);
    else if (capturedImageId) form.append("image_id", capturedImageId);
    form.append("expected_text", document.getElementById("expectedText").value);   //the expected text drives the accuracy columns
    form.append("expected_author", document.getElementById("expectedAuthor").value);

    const res = await apiFetch("/api/classify", { method: "POST", body: form });
    showResult(res);
    persist({ lastResult: res });
  } catch (e) {
    showError("classifyError", e.message);
  } finally {
    classifyBtn.disabled = false;
    classifyBtn.innerHTML = "Classify";
  }
});

window.addEventListener("beforeunload", stopPreview);   // leaving the page releases the camera
</script>
</body>
</html>
